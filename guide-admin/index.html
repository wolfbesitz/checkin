<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Guide bearbeiten</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#faf7f0;--card:#fffdf8;--ink:#2a2622;--muted:#7a736a;--gold:#c9a35a;--gold2:#e9d9ad;--gold-dark:#a8843c;--line:#eadfc6;--ok:#2e7d4f;--err:#b3261e;--warn:#fff3d6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(250,247,240,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--gold2)}
.bar{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.bar h1{font-size:22px;margin:0;flex:1 1 100%;line-height:1.1;font-weight:700}
.bar h1 small{font:400 12.5px Inter,sans-serif;color:var(--muted);margin-left:6px}
.bar select{flex:1 1 100%;min-width:0;max-width:100%;padding:9px 10px;border:1px solid var(--gold);border-radius:10px;background:#fff}
.bar .btn{flex:1 1 auto}
.btn{border:1px solid var(--gold);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--gold2)}
.btn.primary{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.primary:hover{background:var(--gold-dark)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
main{max-width:820px;margin:0 auto;padding:16px 16px 40px}
.banner{max-width:820px;margin:10px auto 0;padding:10px 14px;border-radius:10px;font-size:14px;margin-left:16px;margin-right:16px}
@media(min-width:852px){.banner{margin-left:auto;margin-right:auto}}
.banner.warn{background:var(--warn);border:1px solid var(--gold)}
.banner.ok{background:#e6f4ea;border:1px solid #9fd2b0}
.banner.err{background:#fdecea;border:1px solid #f0a8a2;color:var(--err)}
.banner a{color:var(--gold-dark)}
h2.g{font-size:28px;margin:26px 0 8px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px;cursor:pointer}

.card .t{font:600 19px/1.25 "Cormorant Garamond",Georgia,serif;display:block;overflow-wrap:anywhere}

.badge.draft{background:var(--gold);color:#fff;font-weight:600}
.badge.fail{background:var(--err);color:#fff}
.frame{background:var(--card);border:1px solid var(--gold);box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--gold2);border-radius:10px}
.welcome{padding:14px 16px;margin:6px 4px 14px;cursor:pointer;text-align:left;width:calc(100% - 8px)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

footer{max-width:820px;margin:0 auto;padding:0 16px 24px;color:var(--muted);font-size:13px}
dialog{border:1px solid var(--gold);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto}

dialog h3{margin:0 0 10px;font-size:24px}
dialog .opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;cursor:pointer;background:#fff}
dialog .opt input{margin-top:5px}
dialog .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
dialog input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100vw - 24px)}
.hist{margin-top:30px}
.hist h2{font-size:24px;margin:0 0 6px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--gold2);border-top-color:var(--gold-dark);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.back{background:none;border:0;color:var(--gold-dark);font-weight:600;cursor:pointer;padding:4px 0}
[hidden]{display:none!important}

 <div class="bar">

<script type="module">
import { Editor, Extension, Node } from "https://esm.sh/@tiptap/core@2.27.2";
import StarterKit from "https://esm.sh/@tiptap/starter-kit@2.27.2?deps=@tiptap/core@2.27.2,@tiptap/pm@2.27.2";
import Underline from "https://esm.sh/@tiptap/extension-underline@2.27.2?deps=@tiptap/core@2.27.2,@tiptap/pm@2.27.2";
import Link from "https://esm.sh/@tiptap/extension-link@2.27.2?deps=@tiptap/core@2.27.2,@tiptap/pm@2.27.2";

const API = "https://awcqjqbvsokfqhofzodn.supabase.co/functions/v1/guide-admin";
const PARAMS = new URLSearchParams(location.search);
const MOCK = PARAMS.has("mock");
const POLL_MS = MOCK ? 800 : 5000;

// BEGIN MDCODEC
// Markdown-Teilmenge <-> Editor-JSON (TipTap/ProseMirror). Rein funktional, ohne DOM.
const IMG_LINE = /^(?:!\[[^\]]*\]\([^)]+\)\s*)+$/;
const safeHref = (h) => /^(https:\/\/[^\s)]+|#[a-z0-9-]+|\{\w+\})$/i.test(h);   // nur https, #anker, {platzhalter} – sonst bleibt es Text
const LINK_RE = /^\[([^\]]*)\]\(([^)\s]+)\)/;
const PH_RE = /^\{(\w+)\}/;
function tokenize(s) {
  const toks = []; let buf = ""; let i = 0;
  const flush = () => { if (buf) { toks.push({ t: "text", v: buf }); buf = ""; } };
  while (i < s.length) {
    const r = s.slice(i); let m;
    if (r.startsWith("**")) { flush(); toks.push({ t: "bold" }); i += 2; }
    else if (r.startsWith("++")) { flush(); toks.push({ t: "underline" }); i += 2; }
    else if (r[0] === "*") { flush(); toks.push({ t: "italic" }); i += 1; }
    else if (r[0] === "[" && (m = LINK_RE.exec(r)) && safeHref(m[2])) { flush(); toks.push({ t: "link", text: m[1], href: m[2] }); i += m[0].length; }
    else if (r[0] === "{" && (m = PH_RE.exec(r))) { flush(); toks.push({ t: "ph", name: m[1] }); i += m[0].length; }
    else { buf += r[0]; i += 1; }
  }

}
const mk = (type, extra) => Object.assign({ type }, extra || {});
function parseInline(s, base) {
  base = base || [];
  const toks = tokenize(s);
  for (const k of ["bold", "italic", "underline"]) {            // paarweise; ein übrig gebliebenes Zeichen bleibt Text
    const idx = toks.map((t, i) => (t.t === k ? i : -1)).filter((i) => i >= 0);
    if (idx.length % 2) { const last = toks[idx[idx.length - 1]]; last.t = "text"; last.v = k === "bold" ? "**" : k === "underline" ? "++" : "*"; }
  }
  const active = new Set(); const out = [];
  const push = (node) => { const l = out[out.length - 1]; if (node.type === "text" && l && l.type === "text" && JSON.stringify(l.marks || []) === JSON.stringify(node.marks || [])) l.text += node.text; else out.push(node); };
  const marksNow = (extra) => { const ms = base.slice(); for (const k of ["bold", "italic", "underline"]) if (active.has(k) && !ms.some((m) => m.type === k)) ms.push(mk(k)); if (extra) ms.push(extra); return ms; };
  for (const t of toks) {
    if (t.t === "bold" || t.t === "italic" || t.t === "underline") { active.has(t.t) ? active.delete(t.t) : active.add(t.t); }
    else if (t.t === "text") { const ms = marksNow(); push(Object.assign({ type: "text", text: t.v }, ms.length ? { marks: ms } : {})); }
    else if (t.t === "ph") { const ms = marksNow(); out.push(Object.assign({ type: "placeholder", attrs: { name: t.name } }, ms.length ? { marks: ms } : {})); }
    else if (t.t === "link") {
      const inner = parseInline(t.text, marksNow(mk("link", { attrs: { href: t.href } })));
      if (!inner.length) push({ type: "text", text: "[" + t.text + "](" + t.href + ")" }); else inner.forEach(push);
    }
  }
  return out;
}
function mdToDoc(md) {
  const blocks = []; let blank = false; let cur = null;
  const add = (b) => { b.attrs = Object.assign({ tight: blocks.length > 0 && !blank }, b.attrs || {}); blocks.push(b); blank = false; cur = b; };
  for (const raw of String(md || "").split("\n")) {
    const s = raw.trim();
    if (!s) { blank = true; cur = null; continue; }
    if (IMG_LINE.test(s)) { add({ type: "imageRow", attrs: { raw: s } }); cur = null; continue; }
    let kind = "p", text = s, m;
    if (s.startsWith("- ")) { kind = "bulletList"; text = s.slice(2); }
    else if ((m = /^\d+\. /.exec(s))) { kind = "orderedList"; text = s.slice(m[0].length); }
    if (kind === "p") {
      if (cur && cur.type === "paragraph") { cur.content.push({ type: "hardBreak" }, ...parseInline(text)); }
      else add({ type: "paragraph", content: parseInline(text) });
    } else {
      const item = { type: "listItem", content: [{ type: "paragraph", content: parseInline(text) }] };
      if (cur && cur.type === kind) cur.content.push(item); else add({ type: kind, content: [item] });
    }
  }
  if (!blocks.length) blocks.push({ type: "paragraph", attrs: { tight: false } });
  return { type: "doc", content: blocks };
}
const OPEN = { bold: "**", italic: "*", underline: "++" };
function markKey(m) { return m.type === "link" ? "link:" + m.attrs.href : m.type; }
function inlineToMd(nodes) {                          // nodes einer Zeile (ohne hardBreak)
  let out = ""; const stack = [];
  const closeStr = (k) => (k.startsWith("link:") ? "](" + k.slice(5) + ")" : OPEN[k]);
  const openStr = (k) => (k.startsWith("link:") ? "[" : OPEN[k]);
  const ORDER = ["link", "bold", "italic", "underline"];
  for (const n of nodes) {
    const want = (n.marks || []).map(markKey);
    let drop = -1; for (let i = 0; i < stack.length; i++) if (!want.includes(stack[i])) { drop = i; break; }
    if (drop >= 0) { const keep = stack.splice(drop); for (const k of keep.slice().reverse()) out += closeStr(k); for (const k of keep) if (want.includes(k)) { out += openStr(k); stack.push(k); } }
    const add = want.filter((k) => !stack.includes(k)).sort((a, b) => ORDER.indexOf(a.split(":")[0]) - ORDER.indexOf(b.split(":")[0]));
    for (const k of add) { out += openStr(k); stack.push(k); }
    out += n.type === "text" ? n.text : n.type === "placeholder" ? "{" + n.attrs.name + "}" : "";
  }
  for (const k of stack.slice().reverse()) out += closeStr(k);
  return out;
}
function paraLines(p) {                               // Absatz -> Zeilen (hardBreak = neue Zeile)
  const lines = [[]];
  for (const n of p.content || []) { if (n.type === "hardBreak") lines.push([]); else lines[lines.length - 1].push(n); }
  return lines.map(inlineToMd).map((l) => l.trim()).filter(Boolean);
}
function docToMd(doc) {
  let out = ""; let first = true;
  for (const b of doc.content || []) {
    let txt = "";
    if (b.type === "paragraph") txt = paraLines(b).join("\n");
    else if (b.type === "imageRow") txt = b.attrs.raw;
    else if (b.type === "bulletList" || b.type === "orderedList") {
      txt = (b.content || []).map((li, i) => {
        const nodes = []; (li.content || []).forEach((p) => (p.content || []).forEach((n) => nodes.push(n.type === "hardBreak" ? { type: "text", text: " " } : n)));
        const t = inlineToMd(nodes).trim(); return t ? (b.type === "bulletList" ? "- " : (i + 1) + ". ") + t : "";
      }).filter(Boolean).join("\n");
    }
    if (!txt) continue;
    out += first ? txt : ((b.attrs && b.attrs.tight) ? "\n" : "\n\n") + txt; first = false;
  }
  return out;
}
const placeholdersOf = (md) => [...new Set([...String(md || "").matchAll(/\{(\w+)\}/g)].map((m) => m[1]))];
// END MDCODEC

// BEGIN EXT
function makeExtensions({ Extension, Node, StarterKit, Underline, Link }, unitUrl) {
  const Tight = Extension.create({ name: "tight", addGlobalAttributes() { return [{ types: ["paragraph", "bulletList", "orderedList", "imageRow"], attributes: { tight: { default: false, rendered: false, keepOnSplit: false } } }]; } });
  const Placeholder = Node.create({
    name: "placeholder", group: "inline", inline: true, atom: true, selectable: true,
    addAttributes() { return { name: { default: "" } }; },
    parseHTML() { return [{ tag: "span[data-ph]", getAttrs: (el) => ({ name: el.getAttribute("data-ph") }) }]; },
    renderHTML({ node }) { return ["span", { class: "ph", "data-ph": node.attrs.name, contenteditable: "false" }, "{" + node.attrs.name + "}"]; },
  });
  const ImageRow = Node.create({
    name: "imageRow", group: "block", atom: true, selectable: true,
    addAttributes() { return { raw: { default: "" } }; },
    parseHTML() { return [{ tag: "div[data-raw]", getAttrs: (el) => ({ raw: el.getAttribute("data-raw") }) }]; },
    renderHTML({ node }) {
      const imgs = [...node.attrs.raw.matchAll(/!\[([^\]]*)\]\(([^)]+)\)/g)];
      const kids = imgs.map((m) => ["img", { src: unitUrl() + "img/" + m[2].split("/").pop(), alt: m[1], loading: "lazy" }]);
      return ["div", { class: "imgrow", "data-raw": node.attrs.raw, contenteditable: "false" }, ...kids, ["span", { class: "cap" }, "Bild: " + imgs.map((m) => m[1] || m[2]).join(", ")]];
    },
  });
  return [
    StarterKit.configure({ heading: false, blockquote: false, codeBlock: false, code: false, strike: false, horizontalRule: false }),
    Underline, Link.configure({ openOnClick: false, autolink: false, linkOnPaste: false, validate: safeHref }),
    Tight, Placeholder, ImageRow,
  ];
}
// END EXT

// ---------- Hilfen ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const fmt = (iso) => iso ? new Date(iso).toLocaleString("de-AT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
function toast(msg, ms = 3500) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms); }

// Schlüssel aus #k=… übernehmen, danach aus der Adresszeile entfernen
let KEY = lsGet("guide_admin_key") || "";
{
  const m = /(?:^#|&)k=([^&]+)/.exec(location.hash);
  if (m) { KEY = decodeURIComponent(m[1]); lsSet("guide_admin_key", KEY); }   // Schlüssel bleibt im Link (Lesezeichen/Neu laden funktionieren auch ohne Browser-Speicher)
}
window.addEventListener("hashchange", () => location.reload());
let NAME = lsGet("guide_admin_name") || "";

// ---------- API (echt oder Mock) ----------
async function api(action, payload = {}) {
  if (MOCK) return mockApi(action, payload);
  let r;
  try { r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-guide-key": KEY }, body: JSON.stringify({ action, ...payload }) }); }
  catch { throw new Error("Keine Verbindung. Bitte später noch einmal versuchen."); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { try { localStorage.removeItem("guide_admin_key"); } catch {} throw new Error("Der Link ist nicht gültig. Bitte frag nach einem neuen Link."); }
  if (!r.ok) throw new Error(j.error || "Fehler " + r.status);
  return j;
}
const MOCKDB = { drafts: [], last: [], base: null, n: 0 };
async function mockApi(action, p) {
  await new Promise((r) => setTimeout(r, 120));
  const uid = () => "m" + ++MOCKDB.n;
  if (action === "load") {
    if (!MOCKDB.base) MOCKDB.base = await (await fetch("mock.json")).json();
    return { editor: MOCKDB.base.editor, drafts: MOCKDB.drafts.filter((d) => d.status === "draft" || d.status === "failed"), last: MOCKDB.last.slice(0, 5) };
  }
  if (action === "save") {
    const d = p.draft; let ex = d.id ? MOCKDB.drafts.find((x) => x.id === d.id) : d.kind !== "new" ? MOCKDB.drafts.find((x) => x.status === "draft" && x.kind === d.kind && x.layer === d.layer && (x.section_id || "") === (d.section_id || "")) : null;
    if (ex) Object.assign(ex, d, { id: ex.id, status: "draft" }); else { ex = { ...d, id: uid(), status: "draft", created_at: new Date().toISOString() }; MOCKDB.drafts.push(ex); }
    return { draft: ex };
  }
  if (action === "delete") { MOCKDB.drafts = MOCKDB.drafts.filter((d) => d.id !== p.id); return { ok: true }; }
  if (action === "translate") return { en: p.text.replace(/^/, "[EN] ") };
  if (action === "publish" || action === "undo") {
    const pub = { id: uid(), action, author: p.author, status: "queued", message: "", kh_stale: action === "publish" ? ["gss-23"] : [], cc_stale: [], created_at: new Date().toISOString(), _n: 0, reverts: p.publish_id || null };
    if (action === "publish") MOCKDB.drafts.forEach((d) => { if (d.status === "draft" || d.status === "failed") { d.status = "publishing"; d.publish_id = pub.id; } });
    MOCKDB.last.unshift(pub); return { publish_id: pub.id };
  }
  if (action === "status") {
    const pub = MOCKDB.last.find((x) => x.id === p.publish_id); pub._n++;
    if (pub._n === 1) pub.status = "running"; else if (pub._n >= 2 && pub.status === "running") { pub.status = "success"; pub.finished_at = new Date().toISOString(); MOCKDB.drafts = MOCKDB.drafts.filter((d) => d.publish_id !== pub.id); }
    return { publish: pub };
  }
  throw new Error("Mock: unbekannte Aktion " + action);
}

// ---------- Zustand ----------
const S = { editor: null, drafts: [], last: [], unit: lsGet("guide_admin_unit") || "", view: "list", edit: null, pub: null, poll: null };
const unitObj = () => S.editor.units.find((u) => u.slug === S.unit) || S.editor.units[0];
const layerLabel = (l) => (S.editor.layers[l] ? S.editor.layers[l].label : l);
const layerN = (l) => (S.editor.layers[l] ? S.editor.layers[l].units.length : 1);
const nTxt = (l) => layerN(l) === 1 ? "1 Einheit" : layerN(l) + " Einheiten";
const kindTxt = { edit: "Änderung", new: "Neue Frage", welcome: "Begrüßung" };

function bestDraft(kind, sid) {            // spezifischste Ebene der Einheit gewinnt
  const u = unitObj(); let best = null, bi = -1;
  for (const d of S.drafts) if (d.kind === kind && (d.section_id || null) === (sid || null)) { const i = u.layers.indexOf(d.layer); if (i > bi) { bi = i; best = d; } }
  return best;
}
const draftCount = () => S.drafts.length;
function updateBar() {
  $("#btnDrafts").textContent = `Entwürfe (${draftCount()})`;
  const b = $("#btnPublish"); b.textContent = `Veröffentlichen (${draftCount()})`; b.disabled = !draftCount() || !!(S.pub && ["queued", "running"].includes(S.pub.status));
  $("#who").textContent = NAME ? "· " + NAME : "";
}

// ---------- Dialoge ----------
const dlg = $("#dlg");
function openDlg(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
function ask(title, bodyHtml, okText = "OK", cancelText = "Abbrechen") {
  return new Promise((res) => {
    openDlg(`<h3 class="serif">${esc(title)}</h3><div>${bodyHtml}</div><div class="actions"><button class="btn" data-r="0">${esc(cancelText)}</button><button class="btn primary" data-r="1">${esc(okText)}</button></div>`);
    dlg.onclick = (e) => { const b = e.target.closest("[data-r]"); if (b) { dlg.close(); res(b.dataset.r === "1"); } };
    dlg.oncancel = () => res(false);
  });
}
function askText(title, label, value = "") {
  return new Promise((res) => {
    openDlg(`<h3 class="serif">${esc(title)}</h3><label class="f" for="dt">${esc(label)}</label><input type="text" id="dt" value="${esc(value)}" autocomplete="off"><div class="actions"><button class="btn" data-r="0">Abbrechen</button><button class="btn primary" data-r="1">OK</button></div>`);
    const inp = $("#dt", dlg); setTimeout(() => inp.focus(), 30);
    const done = (ok) => { dlg.close(); res(ok ? inp.value.trim() : null); };
    dlg.onclick = (e) => { const b = e.target.closest("[data-r]"); if (b) done(b.dataset.r === "1"); };
    inp.onkeydown = (e) => { if (e.key === "Enter") done(true); };
    dlg.oncancel = () => res(null);
  });
}

// ---------- Laden ----------
async function load() {
  const r = await api("load");
  S.editor = r.editor; S.drafts = r.drafts || []; S.last = r.last || [];
  if (!S.editor.units.some((u) => u.slug === S.unit)) S.unit = S.editor.units[0].slug;
  const sel = $("#unit"); sel.innerHTML = S.editor.units.map((u) => `<option value="${esc(u.slug)}">${esc(u.name)}</option>`).join(""); sel.value = S.unit;
  const run = S.last.find((p) => ["queued", "running"].includes(p.status) && Date.now() - Date.parse(p.created_at) < 30 * 60e3);
  if (run && !S.pub) trackPublish(run.id, true);
  renderBanners(); updateBar();
}
function renderBanners() {
  let h = "";
  if (S.last.some((p) => (p.kh_stale && p.kh_stale.length) || (p.cc_stale && p.cc_stale.length))) h += `<div class="banner warn">Knowledge Hub / Check-in-Nachrichten noch nicht angepasst – Gideon Bescheid geben.</div>`;
  const p = S.pub;
  if (p) {
    const u = unitObj();
    if (p.status === "queued" || p.status === "running") h += `<div class="banner warn"><span class="spin"></span>Wird gebaut … ca. 2–3 min</div>`;
    else if (p.status === "success") h += `<div class="banner ok">Live ✓ – <a href="${esc(u.url)}" target="_blank" rel="noopener">Seite dieser Einheit öffnen</a></div>`;
    else if (p.status === "failed") h += `<div class="banner err">Fehler: ${esc(p.message || "unbekannt")}. Deine Entwürfe sind noch da.</div>`;
  }
  $("#banners").innerHTML = h;
}

// ---------- Listenansicht ----------
function renderList() {
  S.view = "list"; const u = unitObj();
  const wd = bestDraft("welcome", null);
  const greet = wd ? wd.title.de : u.welcome.greeting.de;
  let h = `<button class="card frame welcome" data-act="welcome"><span class="t">${esc(greet)}</span><div class="badges"><span class="badge">Begrüßung</span><span class="badge">gilt für: ${esc(layerLabel(wd ? wd.layer : u.welcome.src))} (${nTxt(wd ? wd.layer : u.welcome.src)})</span>${wd ? '<span class="badge draft">Entwurf</span>' : ""}</div></button>`;
  const groups = S.editor.groups.slice(); for (const s of u.sections) if (!groups.some((g) => g.id === s.group)) groups.push({ id: s.group, de: s.group });
  for (const g of groups) {
    h += `<h2 class="g serif">${esc(g.de)} <button class="btn small" data-act="new" data-g="${esc(g.id)}">+ Neue Frage</button></h2>`;
    for (const s of u.sections.filter((x) => x.group === g.id)) {
      const d = bestDraft("edit", s.id); const title = d ? d.title.de : s.title.de; const src = d ? d.layer : s.src;
      h += `<button class="card" data-act="edit" data-id="${esc(s.id)}"><span class="t">${esc(title)}</span><div class="badges"><span class="badge">gilt für: ${esc(layerLabel(src))} (${nTxt(src)})</span>${d ? `<span class="badge ${d.status === "failed" ? "fail" : "draft"}">${d.status === "failed" ? "Fehlgeschlagen" : "Entwurf"}</span>` : ""}</div></button>`;
    }
    for (const d of S.drafts.filter((x) => x.kind === "new" && x.group_id === g.id && u.layers.includes(x.layer))) {
      h += `<button class="card" data-act="editnew" data-id="${esc(d.id)}"><span class="t">${esc(d.title.de)}</span><div class="badges"><span class="badge">gilt für: ${esc(layerLabel(d.layer))} (${nTxt(d.layer)})</span><span class="badge draft">Entwurf – neu</span></div></button>`;
    }
  }
  h += historyHtml();
  $("#main").innerHTML = h; updateBar();
}
function historyHtml() {
  if (!S.last.length) return "";
  const st = { queued: "wartet", running: "läuft", success: "fertig", failed: "Fehler" };
  return `<section class="hist"><h2 class="serif">Letzte Veröffentlichungen</h2><ul class="list">${S.last.map((p) => `<li><div class="m"><b>${p.action === "undo" ? "Rückgängig" : "Veröffentlicht"}</b> · ${esc(st[p.status] || p.status)}<small>${esc(fmt(p.created_at))} · ${esc(p.author || "")}${p.message ? " · " + esc(p.message) : ""}</small></div>${p.status === "success" && p.action === "publish" ? `<button class="btn small" data-act="undo" data-id="${esc(p.id)}">Rückgängig</button>` : ""}</li>`).join("")}</ul></section>`;
}

// ---------- Editor-Komponente ----------
function makeRich(host, md, { onInput, onBlur }) {
  host.innerHTML = `<div class="tb"></div><div class="ed"></div>`;
  const tb = host.firstChild, el = host.lastChild;
  const ed = new Editor({
    element: el, extensions: makeExtensions({ Extension, Node, StarterKit, Underline, Link }, () => unitObj().url),
    content: mdToDoc(md),
    onUpdate: () => onInput && onInput(),
    onBlur: () => onBlur && onBlur(),
    onTransaction: () => upd(),
  });
  const btns = [
    ["B", "Fett", () => ed.chain().focus().toggleBold().run(), "bold", "<b>F</b>"],
    ["I", "Kursiv", () => ed.chain().focus().toggleItalic().run(), "italic", "<i>K</i>"],
    ["U", "Unterstrichen", () => ed.chain().focus().toggleUnderline().run(), "underline", "<u>U</u>"],
    ["L", "Link", async () => {
      if (ed.state.selection.empty && !ed.isActive("link")) return toast("Markiere zuerst den Text für den Link.");
      const { from, to } = ed.state.selection;
      const cur = ed.getAttributes("link").href || "https://";
      const v = await askText("Link", "Adresse (https://… oder #anker)", cur);
      await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
      const chain = () => ed.chain().focus().setTextSelection({ from, to });
      if (v === null) return chain().run();
      if (!v) return chain().extendMarkRange("link").unsetLink().run();
      if (!/^(https:\/\/\S+|#[a-z0-9-]+)$/i.test(v)) { chain().run(); return toast("Nur Adressen mit https:// oder #anker sind erlaubt."); }
      chain().extendMarkRange("link").setLink({ href: v }).run();
    }, "link", "Link"],
    ["UL", "Liste", () => ed.chain().focus().toggleBulletList().run(), "bulletList", "• Liste"],
    ["OL", "Nummerierte Liste", () => ed.chain().focus().toggleOrderedList().run(), "orderedList", "1. Liste"],
    ["X", "Link entfernen", () => ed.chain().focus().extendMarkRange("link").unsetLink().run(), null, "Link weg"],
  ];
  tb.innerHTML = btns.map((b, i) => `<button type="button" data-i="${i}" title="${b[1]}" aria-label="${b[1]}">${b[4]}</button>`).join("");
  tb.addEventListener("mousedown", (e) => e.preventDefault());
  tb.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) btns[+b.dataset.i][2](); });
  function upd() { tb.querySelectorAll("button").forEach((b, i) => { const k = btns[i][3]; b.classList.toggle("on", !!k && ed.isActive(k)); }); }
  return { ed, getMd: () => docToMd(ed.getJSON()), setMd: (m) => ed.commands.setContent(mdToDoc(m)), destroy: () => ed.destroy() };
}

// ---------- Bearbeiten ----------
function destroyEditors() { if (S.edit && S.edit.rich) Object.values(S.edit.rich).forEach((r) => r && r.destroy()); }
function openEdit(mode, ctx) {
  destroyEditors();
  const u = unitObj(); let orig, cur, label;
  if (mode === "edit") { const s = u.sections.find((x) => x.id === ctx.id); const d = bestDraft("edit", s.id); orig = { title: s.title, body: s.body }; cur = d || orig; S.edit = { mode, sec: s, draft: d, src: s.src, group: s.group }; label = "Frage bearbeiten"; }
  else if (mode === "welcome") { const d = bestDraft("welcome", null); orig = { title: u.welcome.greeting, body: u.welcome.intro }; cur = d || orig; S.edit = { mode, draft: d, src: u.welcome.src }; label = "Begrüßung bearbeiten"; }
  else if (mode === "editnew") { const d = S.drafts.find((x) => x.id === ctx.id); orig = { title: { de: "", en: "" }, body: { de: "", en: "" } }; cur = d; S.edit = { mode: "new", draft: d, group: d.group_id }; label = "Neue Frage"; }
  else { orig = { title: { de: "", en: "" }, body: { de: "", en: "" } }; cur = orig; S.edit = { mode: "new", group: ctx.group }; label = "Neue Frage"; }
  Object.assign(S.edit, { orig, label, view: "edit", changed: { title: false, body: false }, enTouched: { title: false, body: false }, sug: { title: false, body: false } });
  S.view = "edit";
  const gtxt = S.edit.group ? (S.editor.groups.find((g) => g.id === S.edit.group) || {}).de || S.edit.group : "";
  $("#main").innerHTML = `<button class="back" data-act="back">← Zurück zur Liste</button>
   <h2 class="serif" style="font-size:30px;margin:6px 0 0">${esc(label)}</h2>${gtxt ? `<p class="hint">Gruppe: ${esc(gtxt)}</p>` : ""}
   <label class="f" for="tde">Titel (Deutsch)</label><input class="t" id="tde" maxlength="300" value="${esc(cur.title.de)}">
   <label class="f">Text (Deutsch)</label><div class="rich" id="rde"></div>
   <div class="row" style="margin-top:22px"><button class="btn small" type="button" data-act="retrans">EN neu übersetzen</button></div>
   <label class="f" for="ten">Titel (English)</label><input class="t" id="ten" maxlength="300" value="${esc(cur.title.en)}"><div class="hint sug" id="sug-title" hidden>Vorschlag – bitte kurz prüfen</div>
   <label class="f">Text (English)</label><div class="rich" id="ren"></div><div class="hint sug" id="sug-body" hidden>Vorschlag – bitte kurz prüfen</div>
   <div class="sticky"><button class="btn primary" data-act="save" type="button">Speichern</button><button class="btn" data-act="back" type="button">Abbrechen</button></div>`;
  const E = S.edit;
  E.rich = {
    de: makeRich($("#rde"), cur.body.de, { onInput: () => { E.changed.body = true; }, onBlur: () => autoTrans("body") }),
    en: makeRich($("#ren"), cur.body.en, { onInput: () => { E.enTouched.body = true; showSug("body", false); } }),
  };
  $("#tde").addEventListener("input", () => (E.changed.title = true));
  $("#tde").addEventListener("blur", () => autoTrans("title"));
  $("#ten").addEventListener("input", () => { E.enTouched.title = true; showSug("title", false); });
  window.scrollTo(0, 0);
}
function showSug(k, on) { S.edit.sug[k] = on; const n = $("#sug-" + k); if (n) n.hidden = !on; }
async function translate(k) {
  const E = S.edit; const src = k === "title" ? $("#tde").value.trim() : E.rich.de.getMd();
  if (!src.trim()) return;
  try {
    const r = await api("translate", { text: src, kind: k });
    if (S.edit !== E) return;
    if (E.enTouched[k]) return;                       // EN inzwischen selbst bearbeitet → nicht überschreiben
    if (k === "title") $("#ten").value = r.en.trim(); else E.rich.en.setMd(r.en);
    const now = k === "title" ? $("#tde").value.trim() : E.rich.de.getMd();
    E.changed[k] = now !== src; E.enTouched[k] = false; showSug(k, true);   // DE während der Übersetzung geändert (z. B. Link) → später erneut
  } catch (e) { toast("Übersetzung nicht möglich: " + e.message, 5000); }
}
function autoTrans(k) { const E = S.edit; if (!E || !E.changed[k] || E.enTouched[k]) return; translate(k); }

function placeholderCheck() {
  const E = S.edit; if (!E.orig || E.mode === "new") return [];
  const miss = [];
  for (const l of ["de", "en"]) {
    const now = placeholdersOf(E.rich[l].getMd());
    for (const p of placeholdersOf(E.orig.body[l])) if (!now.includes(p)) miss.push(p);
  }
  return [...new Set(miss)];
}
function scopeOptions() {
  const E = S.edit, u = unitObj(); const o = [], seen = new Set();
  const add = (l, text) => { if (seen.has(l)) return; seen.add(l); o.push({ layer: l, text }); };
  const einheit = "einheit/" + u.slug;
  if (E.mode === "new") {
    add("standard", `Alle Einheiten (${nTxt("standard")})`);
    const city = u.layers.includes("saalfelden") ? "saalfelden" : u.layers.includes("wien") ? "wien" : null;
    if (city) add(city, `${layerLabel(city)} (${nTxt(city)})`);
    const haus = u.layers.find((l) => l.startsWith("haus/")); if (haus) add(haus, `${layerLabel(haus)} (${nTxt(haus)})`);
    add(einheit, `Nur ${u.name}`);
  } else {
    if (!E.src.startsWith("einheit/")) add(E.src, `Überall, wo der Text gilt: ${layerLabel(E.src)} (${nTxt(E.src)})`);
    add(einheit, `Nur ${u.name}`);
  }
  return o;
}
async function saveEdit() {
  const E = S.edit, u = unitObj();
  for (const k of ["title", "body"]) if (E.changed[k] && !E.enTouched[k]) await translate(k);   // offene EN-Vorschläge vor dem Speichern nachziehen
  const title = { de: $("#tde").value.trim(), en: $("#ten").value.trim() };
  const body = { de: E.rich.de.getMd().trim(), en: E.rich.en.getMd().trim() };
  if (!title.de || !body.de) return toast("Titel und Text (Deutsch) fehlen noch.");
  if (!title.en || !body.en) return toast("Titel und Text (English) fehlen noch.");
  if (title.de.length > 300 || title.en.length > 300 || [body.de, body.en].some((b) => b.length > 20000)) return toast("Der Text ist zu lang.");
  const miss = placeholderCheck();
  if (miss.length && !(await ask("Platzhalter fehlt", `<p>Im Original steht ${miss.map((m) => `<code>{${esc(m)}}</code>`).join(", ")}. Hier fehlt das. Auf der Seite fehlt dann ein Wert (zum Beispiel das WLAN-Passwort).</p>`, "Trotzdem speichern", "Zurück"))) return;
  if (E.mode !== "new" && !E.draft && E.orig && JSON.stringify(E.orig.title) === JSON.stringify(title) && JSON.stringify({ de: E.orig.body.de.trim(), en: E.orig.body.en.trim() }) === JSON.stringify(body)) return toast("Nichts geändert.");
  if (!NAME) { const n = await askText("Wie heißt du?", "Dein Name"); if (!n) return; NAME = n; lsSet("guide_admin_name", n); updateBar(); }
  const opts = scopeOptions();
  const pre = E.draft && opts.some((o) => o.layer === E.draft.layer) ? E.draft.layer : opts[0].layer;
  const layer = await new Promise((res) => {
    openDlg(`<h3 class="serif">Für wen gilt die Änderung?</h3>${opts.map((o) => `<label class="opt"><input type="radio" name="sc" value="${esc(o.layer)}" ${o.layer === pre ? "checked" : ""}><span>${esc(o.text)}</span></label>`).join("")}<div class="actions"><button class="btn" data-r="0">Abbrechen</button><button class="btn primary" data-r="1">Als Entwurf speichern</button></div>`);
    dlg.onclick = (e) => { const b = e.target.closest("[data-r]"); if (!b) return; const v = (dlg.querySelector("input:checked") || {}).value; dlg.close(); res(b.dataset.r === "1" ? v : null); };
    dlg.oncancel = () => res(null);
  });
  if (!layer) return;
  const draft = { kind: E.mode, layer, section_id: E.mode === "edit" ? E.sec.id : null, unit: u.slug, group_id: E.mode === "new" ? E.group : null, title, body, author: NAME };
  if (E.draft && E.draft.layer === layer) draft.id = E.draft.id;
  try {
    const r = await api("save", { draft });
    S.drafts = S.drafts.filter((d) => d.id !== r.draft.id && !(d.kind !== "new" && d.kind === r.draft.kind && d.layer === r.draft.layer && (d.section_id || "") === (r.draft.section_id || "")));
    S.drafts.push(r.draft); toast("Als Entwurf gespeichert."); back();
  } catch (e) { toast("Speichern hat nicht geklappt: " + e.message, 6000); }
}
function back() { destroyEditors(); S.edit = null; renderList(); }

// ---------- Entwürfe / Veröffentlichen ----------
function draftsDialog() {
  if (!S.drafts.length) return openDlg(`<h3 class="serif">Entwürfe</h3><p>Keine Entwürfe.</p><div class="actions"><button class="btn" data-x="1">Schließen</button></div>`), (dlg.onclick = (e) => { if (e.target.closest("[data-x]")) dlg.close(); });
  openDlg(`<h3 class="serif">Entwürfe (${S.drafts.length})</h3><ul class="list">${S.drafts.map((d) => `<li><div class="m"><b>${esc(d.title.de)}</b><small>${kindTxt[d.kind] || d.kind} · ${esc(layerLabel(d.layer))} · ${esc(d.author || "")}${d.status === "failed" ? " · fehlgeschlagen" : ""}</small></div><button class="btn small" data-o="${esc(d.id)}">Öffnen</button><button class="btn small danger" data-d="${esc(d.id)}">Löschen</button></li>`).join("")}</ul><div class="actions"><button class="btn" data-x="1">Schließen</button></div>`);
  dlg.onclick = async (e) => {
    if (e.target.closest("[data-x]")) return dlg.close();
    const o = e.target.closest("[data-o]"), d = e.target.closest("[data-d]");
    if (o) { const dr = S.drafts.find((x) => x.id === o.dataset.o); dlg.close(); if (dr.unit && S.editor.units.some((u) => u.slug === dr.unit)) { S.unit = dr.unit; $("#unit").value = dr.unit; } destroyEditors(); S.edit = null;
      if (dr.kind === "new") openEdit("editnew", { id: dr.id }); else if (dr.kind === "welcome") openEdit("welcome"); else if (unitObj().sections.some((s) => s.id === dr.section_id)) openEdit("edit", { id: dr.section_id }); else { renderList(); toast("Dieser Abschnitt gehört zu einer anderen Einheit."); } }
    if (d) { try { await api("delete", { id: d.dataset.d }); S.drafts = S.drafts.filter((x) => x.id !== d.dataset.d); updateBar(); if (S.view === "list") renderList(); draftsDialog(); } catch (er) { toast("Löschen hat nicht geklappt: " + er.message, 5000); } }
  };
}
async function publish() {
  if (!draftCount()) return;
  if (!NAME) { const n = await askText("Wie heißt du?", "Dein Name"); if (!n) return; NAME = n; lsSet("guide_admin_name", n); }
  if (!(await ask("Veröffentlichen?", `<p>${draftCount()} ${draftCount() === 1 ? "Entwurf wird" : "Entwürfe werden"} jetzt auf die Gäste-Seiten gestellt. Das dauert 2–3 Minuten.</p>`, "Veröffentlichen"))) return;
  try { const r = await api("publish", { author: NAME }); trackPublish(r.publish_id || r.id); } catch (e) { toast("Veröffentlichen hat nicht geklappt: " + e.message, 6000); }
}
function trackPublish(id, silent) {
  clearInterval(S.poll); S.pub = { id, status: "queued" }; renderBanners(); updateBar();
  const tick = async () => {
    try {
      const r = await api("status", { publish_id: id }); const p = r.publish || r; S.pub = { id, status: p.status, message: p.message };
      renderBanners(); updateBar();
      if (p.status === "success" || p.status === "failed") { clearInterval(S.poll); const keep = S.pub; await load(); S.pub = keep; renderBanners(); updateBar(); if (S.view === "list") renderList(); }
    } catch (e) { /* nächster Versuch */ }
  };
  S.poll = setInterval(tick, POLL_MS);
}
async function undo(id) {
  if (!(await ask("Rückgängig machen?", `<p>Die Änderungen dieser Veröffentlichung werden zurückgenommen. Das dauert 2–3 Minuten.</p>`, "Rückgängig machen"))) return;
  try { const r = await api("undo", { publish_id: id, author: NAME }); trackPublish(r.publish_id || r.id); } catch (e) { toast("Rückgängig hat nicht geklappt: " + e.message, 6000); }
}

// ---------- Ereignisse ----------
$("#main").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return; const a = b.dataset.act;
  if (a === "edit") openEdit("edit", { id: b.dataset.id });
  else if (a === "editnew") openEdit("editnew", { id: b.dataset.id });
  else if (a === "welcome") openEdit("welcome");
  else if (a === "new") openEdit("new", { group: b.dataset.g });
  else if (a === "back") back();
  else if (a === "save") saveEdit();
  else if (a === "retrans") { translate("title"); translate("body"); }
  else if (a === "undo") undo(b.dataset.id);
});
$("#unit").addEventListener("change", (e) => { S.unit = e.target.value; lsSet("guide_admin_unit", S.unit); destroyEditors(); S.edit = null; renderList(); renderBanners(); });
$("#btnDrafts").addEventListener("click", draftsDialog);
$("#btnPublish").addEventListener("click", publish);

(async function init() {
  if (!KEY && !MOCK) {
    $("#main").innerHTML = `<div class="banner err" style="margin:0 0 14px">Der Zugangsschlüssel fehlt.</div>
      <label class="f" for="keyin">Füge hier den ganzen Link aus WhatsApp ein:</label><input class="t" id="keyin" autocomplete="off" placeholder="https://wolfbesitz.github.io/checkin/guide-admin/#k=…">
      <div class="row" style="margin-top:12px"><button class="btn primary" id="keyok" type="button">Öffnen</button></div>`;
    $("#keyok").addEventListener("click", () => {
      const v = $("#keyin").value.trim(); const k = (/k=([0-9a-f]{16,})/i.exec(v) || /^([0-9a-f]{16,})$/i.exec(v) || [])[1];
      if (!k) return toast("Das ist nicht der richtige Link.");
      lsSet("guide_admin_key", k); location.hash = "k=" + k;
    });
    return;
  }
  try {
    await load();
    renderList();
    if (!NAME) { const n = await askText("Wie heißt du?", "Dein Name"); if (n) { NAME = n; lsSet("guide_admin_name", n); updateBar(); } }
  } catch (e) { $("#main").innerHTML = `<div class="banner err" style="margin:0">${esc(e.message)}</div>`; }
})();
window.__codec = { mdToDoc, docToMd };
</script>
</body>
</html>
