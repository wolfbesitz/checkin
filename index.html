<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Guest registration</title>
<style>
:root{--b:#1a1a1a;--m:#666;--bg:#f6f5f2;--card:#fff;--acc:#2a6f5f;--err:#c0392b;--bd:#ddd}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--b);font-size:16px;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0 4px}h2{font-size:17px;margin:0 0 10px}p.m{color:var(--m);margin:0 0 14px;font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}input,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;font-size:16px;background:#fff}
input.bad,select.bad{border-color:var(--err);background:#fff6f5}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:420px){.row{grid-template-columns:1fr}}
.doc{border-top:1px dashed var(--bd);margin-top:12px;padding-top:6px}.doc small{color:var(--m)}
button{font-size:16px;border-radius:10px;padding:12px 16px;border:1px solid var(--bd);background:#fff;cursor:pointer}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc);width:100%;padding:15px;font-weight:600}button:disabled{opacity:.6}
button.link{border:none;background:none;color:var(--acc);padding:6px 0}
.hdr{display:flex;justify-content:space-between;align-items:center}.lang a{color:var(--m);text-decoration:none;margin-left:10px;font-size:14px;cursor:pointer}.lang a.on{color:var(--b);font-weight:600}
canvas{width:100%;height:160px;border:1px solid var(--bd);border-radius:8px;background:#fff;touch-action:none}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px}.chk input{width:20px;height:20px;margin-top:2px}
.err{color:var(--err);font-size:14px;margin:8px 0}.ok{text-align:center;padding:40px 10px}.ok h1{color:var(--acc)}
.rm{float:right}[hidden]{display:none!important}
</style></head><body><div class="wrap">
<div class="hdr"><h1 id="h_title"></h1><div class="lang"><a id="l_de">DE</a><a id="l_en">EN</a></div></div>
<p class="m" id="h_intro"></p>
<div id="loading" class="ok"><p>…</p></div>
<div id="info" class="ok" hidden><h1 id="info_h"></h1><p id="info_p"></p></div>
<div id="app" hidden>
<div class="card"><h2 id="h_stay"></h2><div><b id="s_prop"></b><br><span id="s_dates"></span></div><p class="m" style="margin-top:8px" id="s_hint"></p></div>
<form id="f" novalidate>
<div id="guests"></div>
<button type="button" class="link" id="add"></button>
<div class="card">
<label class="chk"><input type="checkbox" id="c_privacy"> <span id="t_privacy"></span></label>
<label class="chk" id="row_card" hidden><input type="checkbox" id="c_card"> <span id="t_card"></span></label>
<label id="t_sign"></label><canvas id="sig"></canvas><button type="button" class="link" id="clr"></button>
</div>
<div class="err" id="err" hidden></div>
<button class="primary" id="go"></button>
</form>
</div>
</div>
<script>
const API='https://awcqjqbvsokfqhofzodn.supabase.co/functions/v1/form';
const S={
title:{de:"Gästeregistrierung",en:"Guest registration"},
intro:{de:"Österreich verlangt für jeden Gast eine Meldung (Meldegesetz). Ein Formular für die ganze Gruppe: Hauptgast oben, alle Mitreisenden darunter. Dauert ca. 2 Minuten.",en:"Austrian law requires every guest to be registered. One form for the whole group: main guest on top, all companions below. It takes about 2 minutes."},
stay:{de:"Aufenthalt",en:"Stay"},main:{de:"Hauptgast (du)",en:"Main guest (you)"},companion:{de:"Mitreisende Person",en:"Travelling companion"},
last:{de:"Familienname",en:"Last name"},first:{de:"Vorname(n)",en:"First name(s)"},birth:{de:"Geburtsdatum",en:"Date of birth"},gender:{de:"Geschlecht",en:"Gender"},
g_m:{de:"männlich",en:"male"},g_f:{de:"weiblich",en:"female"},g_d:{de:"divers",en:"diverse"},g_x:{de:"keine Angabe",en:"prefer not to say"},
nat:{de:"Staatsangehörigkeit",en:"Nationality"},choose:{de:"bitte wählen",en:"please select"},addr:{de:"Adresse (Hauptwohnsitz)",en:"Home address"},
street:{de:"Straße, Hausnummer",en:"Street, number"},zip:{de:"PLZ",en:"Postcode"},city:{de:"Ort",en:"City"},country:{de:"Land",en:"Country"},
email:{de:"E-Mail",en:"E-mail"},email_card:{de:"E-Mail (für die Saalfelden Leogang Card)",en:"E-mail (for the Saalfelden Leogang Card)"},
doc:{de:"Reisedokument (nur für Gäste ohne österreichische Staatsbürgerschaft)",en:"Travel document (only for non-Austrian citizens)"},
doc_type:{de:"Art",en:"Type"},passport:{de:"Reisepass",en:"Passport"},id_card:{de:"Personalausweis",en:"ID card"},doc_no:{de:"Nummer",en:"Number"},doc_issued:{de:"Ausstellungsdatum",en:"Date of issue"},
doc_auth:{de:"Ausstellende Behörde",en:"Issuing authority"},doc_country:{de:"Ausstellender Staat",en:"Issuing country"},doc_opt:{de:"Für Familienangehörige des Hauptgastes freiwillig.",en:"Optional for family members of the main guest."},
add:{de:"+ Weitere Person",en:"+ Add person"},remove:{de:"Entfernen",en:"Remove"},
consent_privacy:{de:"Ich stimme zu, dass die Daten zur Erfüllung der gesetzlichen Meldepflicht verarbeitet und 7 Jahre aufbewahrt werden.",en:"I agree that this data is processed to fulfil the legal registration duty and stored for 7 years."},
consent_card:{de:"Ich stimme zu, dass Name, Geburtsdatum und E-Mail an den Tourismusverband Saalfelden Leogang zur Ausstellung der Gästekarte übermittelt werden.",en:"I agree that name, date of birth and e-mail are passed on to the Saalfelden Leogang tourist board to issue the guest card."},
sign:{de:"Unterschrift des Hauptgastes (mit Finger oder Maus)",en:"Signature of the main guest (finger or mouse)"},clear:{de:"Löschen",en:"Clear"},
submit:{de:"Registrierung absenden",en:"Submit registration"},sending:{de:"Wird gesendet …",en:"Sending …"},
done_h:{de:"Danke, Registrierung erhalten!",en:"Thank you, registration received!"},done_p:{de:"Deinen Check-in-Code bekommst du ca. 4 Stunden vor dem Check-in im Chat der Buchungsplattform.",en:"You will receive your check-in code about 4 hours before check-in in the booking platform chat."},
already_h:{de:"Schon registriert",en:"Already registered"},already_p:{de:"Diese Buchung ist bereits registriert. Änderungen bitte kurz im Chat melden.",en:"This booking is already registered. For changes, just send us a message in the chat."},
invalid_h:{de:"Link ungültig",en:"Invalid link"},invalid_p:{de:"Dieser Link ist nicht (mehr) gültig. Bitte melde dich kurz im Chat der Buchungsplattform.",en:"This link is not valid (anymore). Please contact us via the booking platform chat."},
err:{de:"Da ist etwas schiefgelaufen. Bitte prüfe die rot markierten Felder.",en:"Something went wrong. Please check the fields marked in red."},
need_sign:{de:"Bitte unterschreiben.",en:"Please sign."},
guests_hint:{de:"Laut Buchung reist ihr zu {n}. Bitte trag alle Mitreisenden unten in diesem einen Formular ein und sende es einmal ab. Nicht pro Person ein eigenes Formular.",en:"According to the booking you are {n} people. Please add all companions below in this one form and submit it once. No separate form per person."},
offline:{de:"Verbindung fehlgeschlagen. Bitte später noch einmal versuchen.",en:"Connection failed. Please try again later."}};
const C="AF AX AL DZ AS AD AO AI AQ AG AR AM AW AU AT AZ BS BH BD BB BY BE BZ BJ BM BT BO BQ BA BW BV BR IO BN BG BF BI CV KH CM CA KY CF TD CL CN CX CC CO KM CG CD CK CR CI HR CU CW CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FK FO FJ FI FR GF PF TF GA GM GE DE GH GI GR GL GD GP GU GT GG GN GW GY HT HM VA HN HK HU IS IN ID IR IQ IE IM IL IT JM JP JE JO KZ KE KI KP KR KW KG LA LV LB LS LR LY LI LT LU MO MG MW MY MV ML MT MH MQ MR MU YT MX FM MD MC MN ME MS MA MZ MM NA NR NP NL NC NZ NI NE NG NU NF MK MP NO OM PK PW PS PA PG PY PE PH PN PL PT PR QA RE RO RU RW BL SH KN LC MF PM VC WS SM ST SA SN RS SC SL SG SX SK SI SB SO ZA GS SS ES LK SD SR SJ SE CH SY TW TJ TZ TH TL TG TK TO TT TN TR TM TC TV UG UA AE GB US UM UY UZ VU VE VN VG VI WF EH YE ZM ZW XK".split(" ");
const q=new URLSearchParams(location.search), TOKEN=q.get('t')||'';
function guessCountry(loc){if(!loc)return'';const part=loc.split(',').pop().trim().toLowerCase();if(!part)return'';
try{const en=new Intl.DisplayNames(['en'],{type:'region'});for(const c of C){const nm=(en.of(c)||'').toLowerCase();if(nm===part||(part.length>3&&(nm.startsWith(part)||part.startsWith(nm))))return c;}}catch(e){}
const alias={'usa':'US','united states':'US','uk':'GB','england':'GB','scotland':'GB','wales':'GB','deutschland':'DE','österreich':'AT','schweiz':'CH','czechia':'CZ','czech republic':'CZ','south korea':'KR','russia':'RU','türkiye':'TR','turkey':'TR','holland':'NL'};return alias[part]||'';}
const LQ=q.get('lang')==='de'?'de':q.get('lang')==='en'?'en':null;let L=null, D=null, T={}, copts='', n=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setLang(l){L=l;T=Object.fromEntries(Object.entries(S).map(([k,v])=>[k,v[l]]));document.documentElement.lang=l;document.title=T.title;
$('h_title').textContent=T.title;$('h_intro').textContent=T.intro;$('l_de').className=l==='de'?'on':'';$('l_en').className=l==='en'?'on':'';
let dn;try{dn=new Intl.DisplayNames([l],{type:'region'})}catch(e){}const cn=c=>{try{return dn?dn.of(c):c}catch(e){return c}};
copts=C.map(c=>({c,n:cn(c)})).sort((a,b)=>a.n.localeCompare(b.n,l)).map(o=>'<option value="'+o.c+'">'+esc(o.n)+'</option>').join('');}
function info(kind){$('loading').hidden=true;$('app').hidden=true;$('info').hidden=false;$('info_h').textContent=T[kind+'_h'];$('info_p').textContent=T[kind+'_p'];}
function fmtDate(s){try{return new Date(s+'T00:00:00').toLocaleDateString(L==='de'?'de-AT':'en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}catch(e){return s}}
function card(i){const main=i===1;n=Math.max(n,i);const SAAL=D.saalfelden;
return '<div class="card g" data-i="'+i+'">'+(main?'':'<button type="button" class="link rm">'+T.remove+'</button>')+'<h2>'+(main?T.main:T.companion+' '+(i-1))+'</h2>'
+'<div class="row"><div><label>'+T.last+'</label><input name="last_name" required value="'+(main?esc(D.lastName):'')+'"></div><div><label>'+T.first+'</label><input name="first_name" required value="'+(main?esc(D.firstName):'')+'"></div></div>'
+'<div class="row"><div><label>'+T.birth+'</label><input name="birth_date" type="date" required max="'+new Date().toISOString().slice(0,10)+'"></div><div><label>'+T.gender+'</label><select name="gender"><option value="">'+T.choose+'</option><option value="m">'+T.g_m+'</option><option value="f">'+T.g_f+'</option><option value="d">'+T.g_d+'</option><option value="x">'+T.g_x+'</option></select></div></div>'
+'<label>'+T.nat+'</label><select name="nationality" required><option value="">'+T.choose+'</option>'+copts+'</select>'
+(main?'<div style="margin-top:8px"><b style="font-size:13px;color:var(--m)">'+T.addr+'</b><label>'+T.street+'</label><input name="street" required><div class="row"><div><label>'+T.zip+'</label><input name="zip" required></div><div><label>'+T.city+'</label><input name="city" required></div></div><label>'+T.country+'</label><select name="country" required><option value="">'+T.choose+'</option>'+copts+'</select></div>':'')
+((main||SAAL)?'<label>'+(SAAL?T.email_card:T.email)+'</label><input name="email" type="email" '+(main?'required':'')+' value="'+(main?esc(D.email):'')+'">':'')
+'<div class="doc" hidden><label style="margin-top:4px"><b>'+T.doc+'</b></label>'+(main?'':'<small>'+T.doc_opt+'</small>')+'<div class="row"><div><label>'+T.doc_type+'</label><select name="doc_type"><option value="passport">'+T.passport+'</option><option value="id_card">'+T.id_card+'</option></select></div><div><label>'+T.doc_no+'</label><input name="doc_number" '+(main?'data-req="1"':'')+'></div></div><div class="row"><div><label>'+T.doc_issued+'</label><input name="doc_issued" type="date"></div><div><label>'+T.doc_auth+'</label><input name="doc_authority"></div></div><label>'+T.doc_country+'</label><select name="doc_country"><option value="">'+T.choose+'</option>'+copts+'</select></div>'
+'</div>';}
function mainNat(){const m=document.querySelector('.g[data-i="1"] [name=nationality]');return m?m.value:''}
function wire(el){const nat=el.querySelector('[name=nationality]'),doc=el.querySelector('.doc');
if(el.dataset.i!=='1'&&!nat.value&&mainNat()){nat.value=mainNat();doc.hidden=nat.value==='AT'}
if(el.dataset.i==='1')nat.addEventListener('change',()=>{document.querySelectorAll('.g:not([data-i="1"]) [name=nationality]').forEach(o=>{if(!o.value||o.dataset.auto){o.value=nat.value;o.dataset.auto='1';o.dispatchEvent(new Event('change'))}})});
else nat.addEventListener('change',()=>{delete nat.dataset.auto});
nat.addEventListener('change',()=>{doc.hidden=!nat.value||nat.value==='AT';const co=el.querySelector('[name=country]');if(co&&!co.value)co.value=nat.value;const dc=el.querySelector('[name=doc_country]');if(dc&&!dc.value)dc.value=nat.value;});
const rm=el.querySelector('.rm');if(rm)rm.onclick=()=>el.remove();}
function render(){const G=$('guests');G.innerHTML='';n=0;
$('h_stay').textContent=T.stay;$('s_prop').textContent=D.property;$('s_dates').textContent=fmtDate(D.arrival)+' → '+fmtDate(D.departure);$('s_hint').textContent=T.guests_hint.replace('{n}',D.guestsTotal);
$('add').textContent=T.add;$('t_privacy').textContent=T.consent_privacy;$('t_card').textContent=T.consent_card;$('row_card').hidden=!D.saalfelden;$('t_sign').textContent=T.sign;$('clr').textContent=T.clear;$('go').textContent=T.submit;
for(let i=1;i<=Math.max(1,D.guestsTotal);i++)G.insertAdjacentHTML('beforeend',card(i));G.querySelectorAll('.g').forEach(wire);
const cc0=guessCountry(D.location);if(cc0){const m=G.querySelector('.g[data-i="1"]');['nationality','country'].forEach(k=>{const el=m.querySelector('[name='+k+']');if(el&&!el.value)el.value=cc0;});m.querySelector('[name=nationality]').dispatchEvent(new Event('change'));}
$('loading').hidden=true;$('info').hidden=true;$('app').hidden=false;fit();}
$('add').onclick=()=>{const G=$('guests');G.insertAdjacentHTML('beforeend',card(n+1));wire(G.lastElementChild)};
$('l_de').onclick=()=>{setLang('de');if(D)render()};$('l_en').onclick=()=>{setLang('en');if(D)render()};
// Unterschrift
const cv=$('sig'),cx=cv.getContext('2d');let drawing=false,has=false;
function fit(){const r=cv.getBoundingClientRect();if(!r.width)return;cv.width=r.width*2;cv.height=r.height*2;cx.setTransform(1,0,0,1,0,0);cx.scale(2,2);cx.lineWidth=2;cx.lineCap='round';cx.strokeStyle='#111';has=false;}
const pos=e=>{const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]};
const st=e=>{drawing=true;has=true;const[x,y]=pos(e);cx.beginPath();cx.moveTo(x,y);e.preventDefault()};
const mv=e=>{if(!drawing)return;const[x,y]=pos(e);cx.lineTo(x,y);cx.stroke();e.preventDefault()};const en=()=>{drawing=false};
cv.addEventListener('mousedown',st);cv.addEventListener('mousemove',mv);window.addEventListener('mouseup',en);
cv.addEventListener('touchstart',st,{passive:false});cv.addEventListener('touchmove',mv,{passive:false});cv.addEventListener('touchend',en);
$('clr').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);has=false};
// Absenden
$('f').onsubmit=async e=>{e.preventDefault();const err=$('err');err.hidden=true;let bad=false;document.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));
const guests=[...document.querySelectorAll('.g')].map((el,idx)=>{const o={position:idx+1};el.querySelectorAll('input,select').forEach(i=>{o[i.name]=i.value.trim()});
const dv=!el.querySelector('.doc').hidden;el.querySelectorAll('[required]').forEach(i=>{if(!i.value.trim()){i.classList.add('bad');bad=true}});
if(dv)el.querySelectorAll('[data-req]').forEach(i=>{if(!i.value.trim()){i.classList.add('bad');bad=true}});
if(!dv)['doc_type','doc_number','doc_issued','doc_authority','doc_country'].forEach(k=>o[k]='');return o;});
const cp=$('c_privacy'),cc=$('c_card');cp.parentElement.style.color='';cc.parentElement.style.color='';
if(!cp.checked){bad=true;cp.parentElement.style.color='var(--err)'}if(D.saalfelden&&!cc.checked){bad=true;cc.parentElement.style.color='var(--err)'}
if(!has){bad=true;err.textContent=T.need_sign;err.hidden=false}
if(bad){if(err.hidden){err.textContent=T.err;err.hidden=false}const b=document.querySelector('.bad');if(b)b.scrollIntoView({behavior:'smooth',block:'center'});return}
const go=$('go');go.disabled=true;go.textContent=T.sending;
try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,lang:L,guests,consents:{privacy:true,card:!!(D.saalfelden&&cc.checked)},signature:cv.toDataURL('image/png')})});
const j=await r.json().catch(()=>({}));if(r.status===409){info('already');return}if(!r.ok||!j.ok)throw new Error(j.error||r.status);
$('app').hidden=true;info('done');window.scrollTo(0,0);}
catch(ex){err.textContent=T.err+' ('+ex.message+')';err.hidden=false;go.disabled=false;go.textContent=T.submit}};
// Laden
(async()=>{setLang(LQ||((navigator.language||'en').toLowerCase().startsWith('de')?'de':'en'));
if(!TOKEN){info('invalid');return}
try{const r=await fetch(API+'?t='+encodeURIComponent(TOKEN));const j=await r.json();
if(!j.ok){if(!LQ&&j.lang)setLang(j.lang);info(j.kind==='already'?'already':'invalid');return}
D=j;if(!LQ&&j.lang)setLang(j.lang);render();}
catch(e){$('loading').innerHTML='<p>'+T.offline+'</p>'}})();
</script></body></html>
