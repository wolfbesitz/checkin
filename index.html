function setLang(l){L=l;T=Object.fromEntries(Object.entries(S).map(([k,v])=>[k,v[l]??(S2[l]||{})[k]??v.en]));if(!S.months[l]){try{const f=new Intl.DateTimeFormat(LOC[l],{month:'long'});T.months=Array.from({length:12},(_,i)=>f.format(new Date(2020,i,1)))}catch(e){T.months=S.months.en}}document.documentElement.lang=l;document.title=T.title;
$('h_title').textContent=T.title;$('h_intro').textContent=T.intro;$('lsel').value=l;
let dn;try{dn=new Intl.DisplayNames([l],{type:'region'})}catch(e){}const cn=c=>{try{return dn?dn.of(c):c}catch(e){return c}};
copts=C.map(c=>({c,n:cn(c)})).sort((a,b)=>a.n.localeCompare(b.n,l)).map(o=>'<option value="'+o.c+'">'+esc(o.n)+'</option>').join('');}
function info(kind){$('loading').hidden=true;$('app').hidden=true;$('info').hidden=false;$('info_h').textContent=T[kind+'_h'];$('info_p').textContent=T[kind+'_p'];}
function fmtDate(s){try{return new Date(s+'T00:00:00').toLocaleDateString(LOC[L]||'en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}catch(e){return s}}
function dateField(name,req,kind){const y0=new Date().getFullYear(),yMin=kind==='birth'?1920:y0-25;let ys='';for(let y=y0;y>=yMin;y--)ys+='<option value="'+y+'">'+y+'</option>';
let ms='';T.months.forEach((m,i)=>{ms+='<option value="'+String(i+1).padStart(2,'0')+'">'+m+'</option>'});let ds='';for(let d=1;d<=31;d++)ds+='<option value="'+String(d).padStart(2,'0')+'">'+d+'</option>';
return '<div class="date"><select class="d-d"><option value="">'+T.day+'</option>'+ds+'</select><select class="d-m"><option value="">'+T.month+'</option>'+ms+'</select><select class="d-y"><option value="">'+T.year+'</option>'+ys+'</select><input type="hidden" name="'+name+'" '+(req==='req'?'required':req==='data'?'data-req="1"':'')+'></div>';}
function wireDates(el){el.querySelectorAll('.date').forEach(w=>{const d=w.querySelector('.d-d'),m=w.querySelector('.d-m'),y=w.querySelector('.d-y'),h=w.querySelector('input');
const upd=()=>{if(m.value&&y.value){const max=new Date(Number(y.value),Number(m.value),0).getDate();[...d.options].forEach(o=>{if(o.value)o.disabled=Number(o.value)>max});if(d.value&&Number(d.value)>max)d.value=''}
const v=(d.value&&m.value&&y.value)?y.value+'-'+m.value+'-'+d.value:'';if(v!==h.value){h.value=v;h.dispatchEvent(new Event('change'))}};[d,m,y].forEach(x=>x.addEventListener('change',upd));});}
function card(i){const main=i===1;n=Math.max(n,i);const SAAL=D.saalfelden;
return '<div class="card g" data-i="'+i+'">'+(main?'':'<button type="button" class="link rm">'+T.remove+'</button>')+'<h2>'+(main?T.main:T.companion+' '+(i-1))+'</h2>'
+'<div class="row"><div><label>'+T.last+'</label><input name="last_name" required value="'+(main?esc(D.lastName):'')+'"></div><div><label>'+T.first+'</label><input name="first_name" required value="'+(main?esc(D.firstName):'')+'"></div></div>'
+'<div class="row"><div><label>'+T.birth+'</label>'+dateField('birth_date','req','birth')+'</div>'+(main?'<div><label>'+T.gender+'</label><select name="gender"><option value="">'+T.choose+'</option><option value="m">'+T.g_m+'</option><option value="f">'+T.g_f+'</option><option value="d">'+T.g_d+'</option><option value="x">'+T.g_x+'</option></select></div>':'')+'</div>'
+'<label>'+T.nat+'</label><select name="nationality" required><option value="">'+T.choose+'</option>'+copts+'</select>'
+(main?'<div style="margin-top:8px"><b style="font-size:13px;color:var(--m)">'+T.addr+ib('addr_i')+'</b><label>'+T.street+'</label><input name="street" required><div class="row"><div><label>'+T.zip+'</label><input name="zip" required></div><div><label>'+T.city+'</label><input name="city" required></div></div><label>'+T.country+'</label><select name="country" required><option value="">'+T.choose+'</option>'+copts+'</select></div>':'')
+(main?'<label>'+(SAAL?T.email_card:T.email)+'</label><input name="email" type="email" '+(main?'required':'')+' value="'+(main?esc(D.email):'')+'">':'')
+(main?'<div class="doc" hidden><label style="margin-top:4px"><b>'+T.doc+'</b></label><small>'+T.doc_why+'</small><div class="row"><div><label>'+T.doc_type+'</label><select name="doc_type"><option value="passport">'+T.passport+'</option><option value="id_card">'+T.id_card+'</option></select></div><div><label>'+T.doc_no+'</label><input name="doc_number" data-req="1"></div></div><div class="row"><div><label>'+T.doc_issued+'</label>'+dateField('doc_issued','data','issued')+'</div><div><label>'+T.doc_auth+ib('doc_auth_i')+'</label><input name="doc_authority" data-req="1"></div></div></div>':'')
+'</div>';}
function ib(k){return '<button type="button" class="ib" aria-label="Info">i</button><span class="ih" hidden>'+T[k]+'</span>'}
document.addEventListener('click',e=>{const b=e.target.closest('.ib');if(!b)return;e.preventDefault();const h=b.nextElementSibling;if(h)h.hidden=!h.hidden});
function mainNat(){const m=document.querySelector('.g[data-i="1"] [name=nationality]');return m?m.value:''}
function wire(el){wireDates(el);const nat=el.querySelector('[name=nationality]'),doc=el.querySelector('.doc');
if(el.dataset.i!=='1'&&!nat.value&&mainNat()){nat.value=mainNat();nat.dataset.auto='1'}
if(el.dataset.i==='1')nat.addEventListener('change',()=>{document.querySelectorAll('.g:not([data-i="1"]) [name=nationality]').forEach(o=>{if(!o.value||o.dataset.auto){o.value=nat.value;o.dataset.auto='1';o.dispatchEvent(new CustomEvent('change',{detail:{auto:true}}))}})});
else nat.addEventListener('change',e=>{if(!(e.detail&&e.detail.auto))delete nat.dataset.auto});
nat.addEventListener('change',()=>{if(doc)doc.hidden=!nat.value||nat.value==='AT';const co=el.querySelector('[name=country]');if(co&&!co.value)co.value=nat.value;});
const bd=el.querySelector('[name=birth_date]');if(bd)bd.addEventListener('change',refreshBedDefaults);
const rm=el.querySelector('.rm');if(rm)rm.onclick=()=>{el.remove();refreshBedDefaults()};}
function render(){const G=$('guests');G.innerHTML='';n=0;
$('h_stay').textContent=T.stay;$('s_prop').textContent=D.property;$('s_addr').textContent=D.address||'';$('s_dates').textContent=fmtDate(D.arrival)+' → '+fmtDate(D.departure);$('s_hint').textContent=T.guests_hint.replace('{n}',D.guestsTotal);
$('add').textContent=T.add;$('t_privacy').textContent=T.consent_privacy;$('t_card').textContent=T.consent_card;$('t_card_s').textContent=T.consent_card_s;$('row_card').hidden=!D.saalfelden;$('t_sign').textContent=T.sign;$('clr').textContent=T.clear;$('go').textContent=T.submit;
for(let i=1;i<=Math.max(1,D.guestsTotal);i++)G.insertAdjacentHTML('beforeend',card(i));G.querySelectorAll('.g').forEach(wire);
const cc0=guessCountry(D.location);if(cc0){const m=G.querySelector('.g[data-i="1"]');['nationality','country'].forEach(k=>{const el=m.querySelector('[name='+k+']');if(el&&!el.value)el.value=cc0;});m.querySelector('[name=nationality]').dispatchEvent(new Event('change'));}
if(D.beds&&D.beds.length){$('beds_h').textContent=T.beds_h;$('beds_intro').textContent=T.beds_intro;$('t_crib').textContent=T.crib;bedsTouched=false;renderBeds(D.defaultBeds||defaultCfg(D.beds,D.guestsTotal),false,D.guestsTotal,true);$('bedcard').hidden=D.guestsTotal>=maxPlaces();}
$('loading').hidden=true;$('info').hidden=true;$('app').hidden=false;fit();}
function renderBedsMode(){const ed=!!D.canEdit;$('h_stay').textContent=T.stay;$('s_prop').textContent=D.property;$('s_addr').textContent=D.address||'';$('s_dates').textContent=fmtDate(D.arrival)+' → '+fmtDate(D.departure);$('s_hint').textContent='';
$('guests').innerHTML='';$('add').hidden=true;const ce=!!D.cardEdit;$('consentcard').hidden=!ce;$('t_privacy').hidden=true;$('signbox').hidden=true;$('row_card').hidden=!ce;$('t_card').textContent=T.consent_card;$('t_card_s').textContent=T.consent_card_s;$('c_card').checked=!!D.card;$('bedcard').hidden=false;$('beds_h').textContent=T.beds_change_h;$('beds_intro').textContent=ed?T.beds_intro:'';$('t_crib').textContent=T.crib;
renderBeds(D.bedConfig||{},D.crib,D.sleepers,ed);$('beds_locked').hidden=ed;$('beds_locked').textContent=T.beds_locked;$('go').textContent=T.beds_save;$('go').hidden=!(ed||ce);
$('loading').hidden=true;$('info').hidden=true;$('app').hidden=false;}
$('add').onclick=()=>{const G=$('guests');G.insertAdjacentHTML('beforeend',card(n+1));wire(G.lastElementChild);refreshBedDefaults()};
$('lsel').innerHTML=LANGS.map(([c,n])=>'<option value="'+c+'">'+n+'</option>').join('');$('lsel').onchange=e=>{setLang(e.target.value);if(D)(D.mode==='beds'?renderBedsMode():render())};
// Unterschrift
const cv=$('sig'),cx=cv.getContext('2d');let drawing=false,has=false;
function fit(){const r=cv.getBoundingClientRect();if(!r.width)return;cv.width=r.width*2;cv.height=r.height*2;cx.setTransform(1,0,0,1,0,0);cx.scale(2,2);cx.lineWidth=2;cx.lineCap='round';cx.strokeStyle='#111';has=false;}
const pos=e=>{const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]};
const st=e=>{drawing=true;has=true;const[x,y]=pos(e);cx.beginPath();cx.moveTo(x,y);e.preventDefault()};
const mv=e=>{if(!drawing)return;const[x,y]=pos(e);cx.lineTo(x,y);cx.stroke();e.preventDefault()};const en=()=>{drawing=false};
cv.addEventListener('mousedown',st);cv.addEventListener('mousemove',mv);window.addEventListener('mouseup',en);
cv.addEventListener('touchstart',st,{passive:false});cv.addEventListener('touchmove',mv,{passive:false});cv.addEventListener('touchend',en);
$('clr').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);has=false};
// Absenden
$('f').onsubmit=async e=>{e.preventDefault();const err=$('err');err.hidden=true;let bad=false;document.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));
if(D.mode==='beds'){const p=updatePlaces();if(D.canEdit&&!(p>=Math.min(D.sleepers,maxPlaces())&&p<=D.sleepers+1)){err.textContent=T.beds_err.replace('{n}',D.sleepers);err.hidden=false;return}
const go=$('go');go.disabled=true;go.textContent=T.sending;
try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,lang:L,action:'beds',beds:D.canEdit?readBeds():null,crib:($('c_crib').value==='1'),card:D.cardEdit?$('c_card').checked:undefined})});
const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||r.status);$('app').hidden=true;$('info').hidden=false;$('info_h').textContent=T.beds_saved_h;$('info_p').textContent=T.beds_saved_p;window.scrollTo(0,0);}
catch(ex){err.textContent=T.err+' ('+ex.message+')';err.hidden=false;go.disabled=false;go.textContent=T.beds_save}return;}
const guests=[...document.querySelectorAll('.g')].map((el,idx)=>{const o={position:idx+1};el.querySelectorAll('input,select').forEach(i=>{o[i.name]=i.value.trim()});
const dEl=el.querySelector('.doc');const dv=!!dEl&&!dEl.hidden;el.querySelectorAll('[required]').forEach(i=>{if(!i.value.trim()){markBad(i);bad=true}});
if(dv)el.querySelectorAll('[data-req]').forEach(i=>{if(!i.value.trim()){markBad(i);bad=true}});
if(!dv)['doc_type','doc_number','doc_issued','doc_authority'].forEach(k=>o[k]='');return o;});
const cc=$('c_card');
if(!has){bad=true;err.textContent=T.need_sign;err.hidden=false}
let bedsOut=null,cribOut=false;if(D.beds&&D.beds.length){const n=sleepersFromCards();$('bedsum').dataset.n=n;const p=updatePlaces();bedsOut=readBeds();cribOut=($('c_crib').value==='1');if(!(p>=Math.min(n,maxPlaces())&&p<=n+1)){bad=true;err.textContent=T.beds_err.replace('{n}',n);err.hidden=false;$('bedcard').scrollIntoView({behavior:'smooth',block:'center'})}}
if(bad){if(err.hidden){err.textContent=T.err;err.hidden=false}const b=document.querySelector('.bad');if(b)b.scrollIntoView({behavior:'smooth',block:'center'});return}
const go=$('go');go.disabled=true;go.textContent=T.sending;
try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,lang:L,guests,beds:bedsOut,crib:cribOut,consents:{privacy:true,card:!!(D.saalfelden&&cc.checked)},signature:cv.toDataURL('image/png')})});
const j=await r.json().catch(()=>({}));if(r.status===409){info('already');return}if(!r.ok||!j.ok)throw new Error(j.error||r.status);
$('app').hidden=true;info('done');window.scrollTo(0,0);}
catch(ex){err.textContent=T.err+' ('+ex.message+')';err.hidden=false;go.disabled=false;go.textContent=T.submit}};
// Laden
(async()=>{setLang(LQ||LB||'en');
if(!TOKEN){info('invalid');return}
try{const r=await fetch(API+'?t='+encodeURIComponent(TOKEN));const j=await r.json();
if(!j.ok){if(!LQ&&!LB&&j.lang)setLang(pickL(j.glang)||j.lang);info(j.kind==='already'?'already':'invalid');return}
D=j;if(!LQ&&!LB)setLang(pickL(j.glang)||j.lang||'en');if(j.mode==='beds')renderBedsMode();else render();}
catch(e){$('loading').innerHTML='<p>'+T.offline+'</p>'}})();
</script></body></html>
