<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">

<style>

button{font-size:16px;border-radius:10px;padding:12px 16px;border:1px solid var(--bd);background:#fff;cursor:pointer}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc);width:100%;padding:15px;font-weight:600}button:disabled{opacity:.6}
button.link{border:none;background:none;color:var(--acc);padding:6px 0}
.hdr{display:flex;justify-content:space-between;align-items:center}.lang a{color:var(--m);text-decoration:none;margin-left:10px;font-size:14px;cursor:pointer}.lang a.on{color:var(--b);font-weight:600}
canvas{width:100%;height:160px;border:1px solid var(--bd);border-radius:8px;background:#fff;touch-action:none}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px}.chk input{width:20px;height:20px;margin-top:2px}
.err{color:var(--err);font-size:14px;margin:8px 0}.ok{text-align:center;padding:40px 10px}.ok h1{color:var(--acc)}

.room{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}.room:first-child{border-top:none}.room>b{font-size:15px;padding-top:10px}.it{display:grid;grid-template-columns:1fr 140px;gap:8px;align-items:center;margin:0 0 8px}.it:last-child{margin:0}.it span{font-size:14px}.sum{font-weight:600}.sum.okk{color:var(--acc)}@media(max-width:420px){.room{grid-template-columns:88px 1fr;gap:8px}.it{grid-template-columns:1fr}.it span{color:var(--m);font-size:13px}}
.row>div{min-width:0}input,select{min-width:0;max-width:100%}.date{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1.1fr);gap:6px}.date select{padding:11px 4px;text-overflow:ellipsis}

</div>

if(el.dataset.i!=='1'&&!nat.value&&mainNat()){nat.value=mainNat();nat.dataset.auto='1'}
if(el.dataset.i==='1')nat.addEventListener('change',()=>{document.querySelectorAll('.g:not([data-i="1"]) [name=nationality]').forEach(o=>{if(!o.value||o.dataset.auto){o.value=nat.value;o.dataset.auto='1';o.dispatchEvent(new CustomEvent('change',{detail:{auto:true}}))}})});
else nat.addEventListener('change',e=>{if(!(e.detail&&e.detail.auto))delete nat.dataset.auto});
nat.addEventListener('change',()=>{if(doc)doc.hidden=!nat.value||nat.value==='AT';const co=el.querySelector('[name=country]');if(co&&!co.value)co.value=nat.value;});
const bd=el.querySelector('[name=birth_date]');if(bd)bd.addEventListener('change',refreshBedDefaults);
const rm=el.querySelector('.rm');if(rm)rm.onclick=()=>{el.remove();refreshBedDefaults()};}
function render(){const G=$('guests');G.innerHTML='';n=0;
$('h_stay').textContent=T.stay;$('s_prop').textContent=D.property;$('s_addr').textContent=D.address||'';$('s_dates').textContent=fmtDate(D.arrival)+' → '+fmtDate(D.departure);$('s_hint').textContent=T.guests_hint.replace('{n}',D.guestsTotal);
$('add').textContent=T.add;$('t_privacy').textContent=T.consent_privacy;$('t_card').textContent=T.consent_card;$('t_card_s').textContent=T.consent_card_s;$('row_card').hidden=!D.saalfelden;$('t_sign').textContent=T.sign;$('clr').textContent=T.clear;$('go').textContent=T.submit;
for(let i=1;i<=Math.max(1,D.guestsTotal);i++)G.insertAdjacentHTML('beforeend',card(i));G.querySelectorAll('.g').forEach(wire);
const cc0=guessCountry(D.location);if(cc0){const m=G.querySelector('.g[data-i="1"]');['nationality','country'].forEach(k=>{const el=m.querySelector('[name='+k+']');if(el&&!el.value)el.value=cc0;});m.querySelector('[name=nationality]').dispatchEvent(new Event('change'));}
if(D.beds&&D.beds.length){$('beds_h').textContent=T.beds_h;$('beds_intro').textContent=T.beds_intro;$('t_crib').textContent=T.crib;bedsTouched=false;renderBeds(D.defaultBeds||defaultCfg(D.beds,D.guestsTotal),false,D.guestsTotal,true);$('bedcard').hidden=D.guestsTotal>=maxPlaces();}
$('loading').hidden=true;$('info').hidden=true;$('app').hidden=false;fit();}
function renderBedsMode(){const ed=!!D.canEdit;$('h_stay').textContent=T.stay;$('s_prop').textContent=D.property;$('s_addr').textContent=D.address||'';$('s_dates').textContent=fmtDate(D.arrival)+' → '+fmtDate(D.departure);$('s_hint').textContent='';
$('guests').innerHTML='';$('add').hidden=true;$('consentcard').hidden=true;$('bedcard').hidden=false;$('beds_h').textContent=T.beds_change_h;$('beds_intro').textContent=ed?T.beds_intro:'';$('t_crib').textContent=T.crib;
renderBeds(D.bedConfig||{},D.crib,D.sleepers,ed);$('beds_locked').hidden=ed;$('beds_locked').textContent=T.beds_locked;$('go').textContent=T.beds_save;$('go').hidden=!ed;
$('loading').hidden=true;$('info').hidden=true;$('app').hidden=false;}
$('add').onclick=()=>{const G=$('guests');G.insertAdjacentHTML('beforeend',card(n+1));wire(G.lastElementChild);refreshBedDefaults()};
$('l_de').onclick=()=>{setLang('de');if(D)(D.mode==='beds'?renderBedsMode():render())};$('l_en').onclick=()=>{setLang('en');if(D)(D.mode==='beds'?renderBedsMode():render())};
// Unterschrift
const cv=$('sig'),cx=cv.getContext('2d');let drawing=false,has=false;
function fit(){const r=cv.getBoundingClientRect();if(!r.width)return;cv.width=r.width*2;cv.height=r.height*2;cx.setTransform(1,0,0,1,0,0);cx.scale(2,2);cx.lineWidth=2;cx.lineCap='round';cx.strokeStyle='#111';has=false;}
const pos=e=>{const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]};
const st=e=>{drawing=true;has=true;const[x,y]=pos(e);cx.beginPath();cx.moveTo(x,y);e.preventDefault()};
const mv=e=>{if(!drawing)return;const[x,y]=pos(e);cx.lineTo(x,y);cx.stroke();e.preventDefault()};const en=()=>{drawing=false};
cv.addEventListener('mousedown',st);cv.addEventListener('mousemove',mv);window.addEventListener('mouseup',en);
cv.addEventListener('touchstart',st,{passive:false});cv.addEventListener('touchmove',mv,{passive:false});cv.addEventListener('touchend',en);
$('clr').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);has=false};
// Absenden
$('f').onsubmit=async e=>{e.preventDefault();const err=$('err');err.hidden=true;let bad=false;document.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));
if(D.mode==='beds'){const p=updatePlaces();if(!(p>=Math.min(D.sleepers,maxPlaces())&&p<=D.sleepers+1)){err.textContent=T.beds_err.replace('{n}',D.sleepers);err.hidden=false;return}
const go=$('go');go.disabled=true;go.textContent=T.sending;
try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,lang:L,action:'beds',beds:readBeds(),crib:($('c_crib').value==='1')})});
const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||r.status);$('app').hidden=true;$('info').hidden=false;$('info_h').textContent=T.beds_saved_h;$('info_p').textContent=T.beds_saved_p;window.scrollTo(0,0);}
catch(ex){err.textContent=T.err+' ('+ex.message+')';err.hidden=false;go.disabled=false;go.textContent=T.beds_save}return;}
const guests=[...document.querySelectorAll('.g')].map((el,idx)=>{const o={position:idx+1};el.querySelectorAll('input,select').forEach(i=>{o[i.name]=i.value.trim()});
const dEl=el.querySelector('.doc');const dv=!!dEl&&!dEl.hidden;el.querySelectorAll('[required]').forEach(i=>{if(!i.value.trim()){markBad(i);bad=true}});
if(dv)el.querySelectorAll('[data-req]').forEach(i=>{if(!i.value.trim()){markBad(i);bad=true}});
if(!dv)['doc_type','doc_number','doc_issued','doc_authority'].forEach(k=>o[k]='');return o;});
const cc=$('c_card');
if(!has){bad=true;err.textContent=T.need_sign;err.hidden=false}
let bedsOut=null,cribOut=false;if(D.beds&&D.beds.length){const n=sleepersFromCards();$('bedsum').dataset.n=n;const p=updatePlaces();bedsOut=readBeds();cribOut=($('c_crib').value==='1');if(!(p>=Math.min(n,maxPlaces())&&p<=n+1)){bad=true;err.textContent=T.beds_err.replace('{n}',n);err.hidden=false;$('bedcard').scrollIntoView({behavior:'smooth',block:'center'})}}
if(bad){if(err.hidden){err.textContent=T.err;err.hidden=false}const b=document.querySelector('.bad');if(b)b.scrollIntoView({behavior:'smooth',block:'center'});return}
const go=$('go');go.disabled=true;go.textContent=T.sending;
try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,lang:L,guests,beds:bedsOut,crib:cribOut,consents:{privacy:true,card:!!(D.saalfelden&&cc.checked)},signature:cv.toDataURL('image/png')})});
const j=await r.json().catch(()=>({}));if(r.status===409){info('already');return}if(!r.ok||!j.ok)throw new Error(j.error||r.status);
$('app').hidden=true;info('done');window.scrollTo(0,0);}
catch(ex){err.textContent=T.err+' ('+ex.message+')';err.hidden=false;go.disabled=false;go.textContent=T.submit}};
// Laden
(async()=>{setLang(LQ||((navigator.language||'en').toLowerCase().startsWith('de')?'de':'en'));
if(!TOKEN){info('invalid');return}
try{const r=await fetch(API+'?t='+encodeURIComponent(TOKEN));const j=await r.json();
if(!j.ok){if(!LQ&&j.lang)setLang(j.lang);info(j.kind==='already'?'already':'invalid');return}
D=j;if(!LQ&&j.lang)setLang(j.lang);if(j.mode==='beds')renderBedsMode();else render();}
catch(e){$('loading').innerHTML='<p>'+T.offline+'</p>'}})();
</script></body></html>
